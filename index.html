<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Restaurant 3D Model</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      body {
        margin: 0;
        background-color: #111;
        color: white;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      header {
        padding: 1rem;
        font-size: 2rem;
      }
      model-viewer {
        width: 100vw;
        height: 90vh;
        background: #222;
      }
    </style>
  </head>
  <body>
    <header>Restaurant 3D Model</header>
    <model-viewer
      src="4f727d93-7a6d-45f4-a9c8-ed77a4fb50d8.glb"
      alt="3D model of a restaurant"
      auto-rotate
      camera-controls
      ar
      ar-modes="webxr scene-viewer quick-look"
      shadow-intensity="1"
      exposure="1"
    >
    </model-viewer>
  </body>
</html>
